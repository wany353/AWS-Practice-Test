services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: aws-quiz-backend
    # 数据库连接串从 .env 读取（云端 Neon PostgreSQL，不进 git）
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://0.0.0.0:8080"
    # 只绑定到本机回环，不暴露到公网：
    # 前端容器通过内网 http://backend:8080 访问；本机开发时 Vite 仍可用 localhost:5264
    ports:
      - "127.0.0.1:5264:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: aws-quiz-frontend
    # 对外服务端口。本机 80 被占用时可用 FRONTEND_PORT=5174 docker compose up 覆盖
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped
