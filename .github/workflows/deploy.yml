name: Deploy

# Builds both images on GitHub's runners, pushes them to GHCR and tells the EC2
# box to pull them. The t2.micro never builds anything itself.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Commit SHA of an image that was already built (rollback). Leave empty to build the current main.'
        required: false
        default: ''

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    # Skipped when a rollback names an image that already exists.
    if: github.event_name == 'push' || inputs.image_tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            context: ./Backend
            image: ghcr.io/wany353/aws-practice-test-backend
          - name: frontend
            context: ./Frontend
            image: ghcr.io/wany353/aws-practice-test-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ matrix.image }}:${{ github.sha }}
            ${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    if: always() && needs.build.result != 'failure' && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: echo "tag=${{ inputs.image_tag || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        shell: bash
        run: |
          set -Eeuo pipefail

          # Named up front, so a missing secret says so instead of failing
          # somewhere further down with an empty hostname.
          : "${SSH_KEY:?EC2_SSH_KEY is not configured}"
          : "${EC2_HOST:?EC2_HOST is not configured}"
          : "${EC2_USER:?EC2_USER is not configured}"

          # A trailing newline or space pasted into the secret box reaches us as
          # part of the hostname and makes getaddrinfo fail.
          EC2_HOST="$(printf '%s' "$EC2_HOST" | tr -d '[:space:]')"
          EC2_USER="$(printf '%s' "$EC2_USER" | tr -d '[:space:]')"

          # Secret values are masked in the log, so describe the expected shape
          # rather than echoing what was configured.
          if [[ "$EC2_HOST" =~ ^(https?|ssh):// || "$EC2_HOST" == *@* || "$EC2_HOST" == *:* || "$EC2_HOST" == */* ]]; then
            echo "EC2_HOST must be a bare host, e.g. 54.1.2.3 or ec2-54-1-2-3.compute.amazonaws.com." >&2
            echo "It must not contain a scheme (http://, ssh://), a username, a port or a path." >&2
            exit 1
          fi

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          if ! timeout 20 ssh-keyscan -T 10 -H "$EC2_HOST" \
              > "$HOME/.ssh/known_hosts" 2>/tmp/keyscan.err; then
            cat /tmp/keyscan.err >&2
            echo "Could not read a host key over port 22. Check that EC2_HOST is the instance's current public address (it changes on stop/start without an Elastic IP), that the instance is running, and that the security group allows inbound 22." >&2
            exit 1
          fi
          test -s "$HOME/.ssh/known_hosts"

          # Later steps address the box as "deploy-target", which keeps the
          # secrets out of their command lines.
          cat > "$HOME/.ssh/config" <<SSH_CONFIG
          Host deploy-target
            HostName $EC2_HOST
            User $EC2_USER
            IdentityFile $HOME/.ssh/deploy_key
            BatchMode yes
            ConnectTimeout 15
          SSH_CONFIG
          chmod 600 "$HOME/.ssh/config"

      - name: Test SSH connection
        run: ssh deploy-target 'echo "SSH ok as $(whoami) on $(hostname)"'

      - name: Copy compose file
        run: scp docker-compose.prod.yml deploy-target:~/AWS-Practice-Test/docker-compose.prod.yml

      - name: Pull images and restart
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: ssh deploy-target "TAG='$TAG' bash -s" < scripts/deploy-remote.sh
